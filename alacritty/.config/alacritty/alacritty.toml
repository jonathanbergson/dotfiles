general.live_config_reload = true
general.import = [
  "~/.config/alacritty/themes/ayu/ayu_dark.toml"
]

[env]
TERM = "xterm-256color"

[window]
decorations = "buttonless"
opacity = 1
padding = { x = 18, y = 20 }
startup_mode = "Maximized"
option_as_alt = "OnlyLeft"

[font]
size = 18
offset = { x = 0, y = 3 }

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[font.normal]
family = "Fira Code"
style = "Regular"

[font.bold_italic]
family = "Fira Code"
style = "Bold Italic"
