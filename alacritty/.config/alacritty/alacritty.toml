general.live_config_reload = true
general.import = [
  # "~/.config/alacritty/themes/ayu/ayu_dark.toml"
  "~/.config/alacritty/themes/catppuccin/catppuccin-mocha.toml"
  # "~/.config/alacritty/themes/cursor/cursor-dark.toml"
]

[env]
TERM = "xterm-256color"

[window]
decorations = "buttonless"
opacity = 1
padding = { x = 18, y = 20 }
startup_mode = "Maximized"
option_as_alt = "Both"

[font]
size = 14
# offset = { x = 0, y = 3 }

[font.bold]
# family = "FiraCode Nerd Font Mono"
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
