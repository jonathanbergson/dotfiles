set -g prefix C-f
unbind C-b
bind C-f send-prefix

set -g base-index 1
set -g default-terminal "tmux-256color"

setw -g mode-keys vi

set-option -g mouse on
set-option -g renumber-windows on

# Set reload config key binding
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Set synchronize panes key binding
bind-key a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Catppuccin theme
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text_color ""
set -g @catppuccin_window_number_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_text_color ""
set -g @catppuccin_window_current_number_color "#{@thm_overlay_2}"

set -g @catppuccin_status_background "none"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_module_bg_color ""

# set -g status-justify "centre"
set -g status-left-length 100
set -g status-left ""
set -g status-right-length 100
# set -g status-right "#{E:@catppuccin_status_session}"
# set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"
set -g status-right '#[fg=#{?client_prefix,#{E:@thm_surface_0},#{E:@thm_overlay_2}},bg=#{?client_prefix,#{E:@thm_red},#{E:@thm_surface_0}}] session: #S '

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
